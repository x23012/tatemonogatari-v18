<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅の文の一覧</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ecd6;--paper:#fffaf0;--ink:#222;--ink-2:#5a5248;--line:#e2d4b4;--accent:#8a1c24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN",sans-serif;line-height:1.8}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}
.lead{color:var(--ink-2);margin:0 0 12px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:0;list-style:none}
.toc a{display:inline-block;padding:4px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
section.cat{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 16px}
section.cat>h2{font-size:20px;margin:0 0 2px}
.when{color:var(--ink-2);font-size:14px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.group{border-top:1px dashed var(--line);padding-top:6px}
.group h3{font-size:15px;margin:0 0 2px;color:var(--accent)}
.group ul{margin:0;padding-left:1.2em}
.group li{margin:2px 0}
.ph{background:#fde7b0;border-radius:4px;padding:0 3px;font-weight:700}
rt{font-size:.5em}
.count{font-weight:400;color:var(--ink-2);font-size:14px}
@media print{.toc{display:none}section.cat{break-inside:avoid-page}}
</style></head><body><div class="wrap">
<h1>旅の文の一覧 <span class="count" id="total"></span></h1>
<p class="lead">アプリの「あなたの旅」は、下の部品から1つずつ選んで組み立てます（<code>tabi.js</code> の中身をそのまま表示）。<span class="ph">黄色</span>の所には、カードの名前や月などが入ります。</p>
<ul class="toc" id="toc"></ul>
<div id="list"></div>
</div>
<script src="../tabi.js"></script>
<script>
const R=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>').replace(/%([^%]+)%/g,'<span class="ph">$1</span>');
// 部品の名前と、使われる場面
const CAT={
  title:['旅の名前','いちばん目立つ特ちょうで1つ選ぶ（上の方ほど優先）'],
  combo:['旅の名前（2つの特ちょうがそろったとき）','1番目と2番目に強い特ちょうの組み合わせがあれば、こちらを使う'],
  count:['か所と点数','いつも1行目に出る'],
  season:['季節の流れ','スタンプの月が2つ以上あるとき。いちばん早い月と遅い月の季節で選ぶ'],
  month:['その月のひとこと','いちばん点数の高いカードに月があるとき'],
  highlight:['いちばんの見どころ','いちばん点数の高いカード（同じ点なら国宝＞重要文化財＞登録有形文化財）'],
  area:['旅の広がり','2か所以上のとき。地域の数や名古屋市内かどうかで選ぶ'],
  era:['時代のはば','2か所以上のとき。いちばん古い時代と新しい時代の差で選ぶ'],
  tip:['見学のひとこと','いちばん多い「つくり」か「使いみち」で選ぶ（旅の名前とかぶらないもの）'],
  close:['しめくくり','か所の数で選ぶ（3か所まで／7か所まで／8か所以上）'],
};
const KEY={
  kokuho:'国宝が入っている',highScore:'平均の点数が高い（4てん以上）',era_old:'江戸より前が多い',era_meiji:'明治が多い',era_taisho:'大正が多い',era_showa:'昭和が多い',
  use_inori:'祈り（お寺・神社）が多い',use_kurashi:'暮らし（家）が多い',use_akinai:'商い・産業が多い',use_kokyo:'公共が多い',use_shikumi:'まちのしくみが多い',
  st_wood:'木造が多い',st_brick:'れんが・石が多い',st_concrete:'コンクリート・鉄が多い',one_area:'1つの地域だけ',wide:'尾張と三河の両方',seasons4:'4つの季節がそろう',mix:'目立つ特ちょうがない',few:'1〜2か所',
  same:'同じ季節／同じ時代',all4:'4つの季節がそろう','spring-summer':'春→夏','spring-autumn':'春→秋','spring-winter':'春→冬','summer-autumn':'夏→秋','summer-winter':'夏→冬','autumn-winter':'秋→冬','winter-spring':'冬→春','winter-summer':'冬→夏','winter-autumn':'冬→秋','winter-winter':'冬→（1年まわって）冬',
  juubun:'重要文化財',touroku:'登録有形文化財',one:'1つの地域',two:'2つの地域',many:'3つ以上の地域',nagoya:'ぜんぶ名古屋市内',
  span1:'となりの時代まで',span2:'2つはなれた時代まで',span3:'江戸より前から昭和まで',mid:'4〜7か所',
};
const keyLabel=(cat,k)=>{ if(cat==='month') return k+'月'; if(cat==='combo') return k.split('+').map(x=>KEY[x]||x).join(' ＋ '); if(cat==='close'&&k==='few') return '1〜3か所'; if(cat==='close'&&k==='many') return '8か所以上'; return KEY[k]||k; };
const order=['title','combo','count','season','month','highlight','area','era','tip','close'];
let total=0; const toc=[], html=[];
for(const cat of order){ const v=Tabi.T[cat]; if(!v) continue; const [name,when]=CAT[cat]||[cat,''];
  let n=0, body='';
  if(Array.isArray(v)){ n=v.length; body=`<div class="group"><ul>${v.map(s=>`<li>${R(s)}</li>`).join('')}</ul></div>`; }
  else { body='<div class="grid">'+Object.entries(v).map(([k,arr])=>{ n+=arr.length; return `<div class="group"><h3>${keyLabel(cat,k)}（${arr.length}）</h3><ul>${arr.map(s=>`<li>${R(s)}</li>`).join('')}</ul></div>`; }).join('')+'</div>'; }
  total+=n; toc.push(`<li><a href="#${cat}">${name}（${n}）</a></li>`);
  html.push(`<section class="cat" id="${cat}"><h2>${name} <span class="count">${n}こ</span></h2><p class="when">${when}</p>${body}</section>`);
}
document.getElementById('toc').innerHTML=toc.join(''); document.getElementById('list').innerHTML=html.join(''); document.getElementById('total').textContent=`（ぜんぶで ${total} こ）`;
</script></body></html>
